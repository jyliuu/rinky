[package]
name = "dictionary"
description = "Dictionary plugin: StarDict lookup of the selected word (popup and full view), lookups recorded for the vocabulary builder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# No doctests exist; skipping rustdoc --test saves about 0.7 s per crate in `cargo test`.
doctest = false
path = "lib.rs"

[dependencies]
ink-plugin.workspace = true
ink-store.workspace = true
ink-stats.workspace = true
# Not in the workspace dependency table (owned by the integrator): a path dependency.
ink-dict = { path = "../../crates/ink-dict" }
log.workspace = true

[dev-dependencies]
ink-doc.workspace = true
