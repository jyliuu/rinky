[package]
name = "kosync"
description = "KOReader progress sync (KOSync) plugin: login page, push on page change and close, pull on open"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# No doctests exist; skipping rustdoc --test saves about 0.7 s per crate in `cargo test`.
doctest = false
path = "lib.rs"

[dependencies]
ink-plugin.workspace = true
ink-net.workspace = true
ink-doc.workspace = true
log.workspace = true

[dev-dependencies]
ink-formats.workspace = true
ink-store.workspace = true
