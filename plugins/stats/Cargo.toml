# Reading statistics and vocabulary (phase 10): the `stats` plugin that records reading
# time from the reader hooks, the report math for the Statistics screen and the
# vocabulary database for the Vocabulary screen and the dictionary plugin.
[package]
name = "ink-stats"
description = "Reading statistics recorder plugin, report math and vocabulary database"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# No doctests exist; skipping rustdoc --test saves about 0.7 s per crate in `cargo test`.
doctest = false

[dependencies]
ink-plugin.workspace = true
ink-store.workspace = true
rusqlite.workspace = true
log.workspace = true

[dev-dependencies]
ink-doc.workspace = true
