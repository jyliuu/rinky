[package]
name = "calibre"
description = "Calibre wireless plugin: calibre's Smart Device App protocol over TCP (receive, delete, book list)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# No doctests exist; skipping rustdoc --test saves about 0.7 s per crate in `cargo test`.
doctest = false
path = "lib.rs"

[dependencies]
ink-plugin.workspace = true
log.workspace = true
libc.workspace = true
# SHA-1 of the password challenge and random device ids (already in the tree via ink-net).
ring.workspace = true

[dev-dependencies]
