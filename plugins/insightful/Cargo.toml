[package]
name = "insightful"
description = "Insightful AI reading companion (port of insightful.koplugin v0.7.0) as a first-party plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# No doctests exist; skipping rustdoc --test saves about 0.7 s per crate in `cargo test`.
doctest = false
path = "src/lib.rs"

[dependencies]
ink-plugin.workspace = true
ink-doc.workspace = true
ink-net.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
mlua.workspace = true
log.workspace = true
ink-store.workspace = true
