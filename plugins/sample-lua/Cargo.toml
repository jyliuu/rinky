# Not a Rust plugin: this crate carries the sample Lua plugin (plugin.toml + main.lua)
# so it is a workspace member (plugins/* must hold crates) and its tests run with
# `cargo test`. Only plugin.toml and main.lua go to the Kindle.
[package]
name = "sample-lua-plugin"
description = "The sample Lua plugin (word count and reading timer) and its tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# No doctests exist; skipping rustdoc --test saves about 0.7 s per crate in `cargo test`.
doctest = false
path = "lib.rs"

[dependencies]
ink-plugin.workspace = true

[dev-dependencies]
ink-doc.workspace = true
