name: Bug report
description: Something in rinky does not work as it should.
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device and firmware
      description: Model and firmware version, e.g. "Kindle Paperwhite 12th gen, 5.19.5" or "Kobo Libra 2, 4.38".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rinky version
      description: The first line of /mnt/us/rinky/VERSION (Kobo .adds/rinky/VERSION).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Steps that lead to the problem, and the book format if it matters (EPUB, PDF, ...).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The end of /mnt/us/rinky/rinky.log (Kobo .adds/rinky/rinky.log), and any crash-*.log in the same folder.
      render: text
