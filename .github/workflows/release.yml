# Builds the Kindle install package on every push and pull request, and publishes it as a
# GitHub release when a version tag (v1.2.3) is pushed. The tag must match
# [workspace.package] version in Cargo.toml, and CHANGELOG.md must have a dated section
# for it, whose text becomes the release notes (GitHub's generated list follows it).
#
#   scripts/release.sh tag --ref origin/main --push     (see .claude/skills/release)
#
# Release assets: rinky-V-kindlehf.tar.gz and rinky-V-kobo.tar.gz (SSH install and the in-app
# update), rinky-V-kindle.zip and rinky-V-kobo.zip (USB install), rinky-V-kindlehf.kpkg and
# rinky-V-kpm-repo.json (KPM) and SHA256SUMS (the tarballs and zips; the in-app update checks
# it). The kpm-repo job also publishes manifest.v2.json to the gh-pages branch, which gives
# `kpm add-repo` an address that never carries a version.
name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: armv7-unknown-linux-musleabihf
  ZIG_VERSION: 0.17.0
  CARGO_TERM_COLOR: always
  # The in-app update looks for releases of the repository that built the binary.
  RINKY_RELEASE_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest
  # MuPDF and dropbear are built from pinned, checksummed source tarballs; keep them
  # between runs.
  INK_MUPDF_CACHE: ${{ github.workspace }}/.cache/mupdf-build

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against Cargo.toml and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! scripts/release.sh check "${GITHUB_REF_NAME#v}"; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version or has no dated CHANGELOG.md section (scripts/release.sh check)"
            exit 1
          fi

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lzip bzip2 patch make file zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}-zig${{ env.ZIG_VERSION }}

      - name: Cache MuPDF and dropbear builds
        uses: actions/cache@v4
        with:
          path: |
            .cache/mupdf-build
            target/dropbear
          key: c-deps-zig${{ env.ZIG_VERSION }}-${{ hashFiles('crates/ink-mupdf/build.rs', 'crates/ink-mupdf/csrc/**', 'scripts/build-dropbear.sh', 'packaging/dropbear/**') }}

      - name: Build the package
        run: scripts/package.sh --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: rinky-kindle-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.kpkg
            dist/*-kpm-repo.json
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rinky-kindle-${{ github.sha }}
          path: dist
      - name: Release notes from CHANGELOG.md
        run: scripts/release.sh notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.kpkg
            dist/*-kpm-repo.json
            dist/SHA256SUMS
          # The changelog section; GitHub's generated PR list is added after it.
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true

  # A stable address for `kpm add-repo`: the manifest is rewritten on every release and
  # pushed to the gh-pages branch, so the URL never carries a version. Only the manifest
  # lives there (a few KB); the .kpkg stays with the release assets. Enable Pages once
  # (Settings > Pages > Deploy from a branch > gh-pages) and the address becomes
  # https://<owner>.github.io/<repo>/manifest.v2.json.
  kpm-repo:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rinky-kindle-${{ github.sha }}
          path: dist

      - name: Build the KPM repository manifest
        run: |
          python3 - dist "${{ github.repository }}" "${{ github.ref_name }}" <<'PY'
          import json, os, re, sys

          dist, repo, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          version = tag[1:] if tag.startswith("v") else tag
          nums = [int(part) for part in re.findall(r"\d+", version)][:3]
          nums += [0] * (3 - len(nums))
          package = f"rinky-{version}-kindlehf.kpkg"
          if not os.path.exists(os.path.join(dist, package)):
              sys.exit(f"error: {package} was not built")
          manifest = {
              "manifest_version": 2,
              "id": "rinky",
              "name": "rinky",
              "description": "An e-book reader for Kindle and Kobo, written in Rust.",
              "packages": {
                  "rinky": {
                      "name": "rinky",
                      "author": "jyliuu",
                      "description": "An e-book reader for Kindle and Kobo, written in Rust. "
                      "EPUB, MOBI, AZW3, FB2, TXT, HTML, PDF and CBZ.",
                      "artifacts": [
                          {
                              "url": f"https://github.com/{repo}/releases/download/{tag}/{package}",
                              "version": nums,
                              "dependencies": [],
                              "supported_platforms": ["kindlehf"],
                          }
                      ],
                  }
              },
          }
          with open(os.path.join(dist, "manifest.v2.json"), "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Publish it to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work=$(mktemp -d)
          cd "$work"
          git init -q
          git remote add origin "$remote"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch -q --depth 1 origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi
          cp "$GITHUB_WORKSPACE/dist/manifest.v2.json" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "manifest unchanged"
            exit 0
          fi
          git commit -q -m "KPM repository: rinky ${GITHUB_REF_NAME}"
          git push -q origin gh-pages
