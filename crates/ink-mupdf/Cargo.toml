[package]
name = "ink-mupdf"
description = "Fixed-layout documents (PDF, CBZ, XPS) through MuPDF over C FFI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"
# MuPDF 1.27.2 is built from the pinned source tarball by build.rs (see the crate docs).
links = "mupdf"

[lib]
# No doctests exist; skipping rustdoc --test saves about 0.7 s per crate in `cargo test`.
doctest = false

[dependencies]
ink-doc.workspace = true
ink-device.workspace = true
log.workspace = true
# PNG pages for the generated CBZ fixtures (`testgen`); already used by ink-device.
png.workspace = true

[build-dependencies]
# Already in Cargo.lock (ring, rusqlite and mlua build C with it); used here only to
# compile the small FFI shim with the target's C compiler.
cc = "1.10.0"

[[example]]
name = "mupdf-fixtures"
path = "examples/mupdf-fixtures.rs"

[[example]]
name = "mupdf-render"
path = "examples/mupdf-render.rs"
