[package]
name = "ink-dict"
description = "StarDict reader (.ifo/.idx[.gz]/.dict[.dz]/.syn), word normalization and lookup"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# No doctests exist; skipping rustdoc --test saves about 0.7 s per crate in `cargo test`.
doctest = false

[dependencies]
thiserror.workspace = true
# Already in Cargo.lock through zip and ink-formats (zlib-rs backend).
flate2 = { workspace = true, features = ["zlib-rs"] }
