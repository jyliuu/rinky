# rinky workspace. Owned by the integrator: crate agents change only their own
# crates/<name>/Cargo.toml and ask for new entries here.
[workspace]
resolver = "2"
members = ["crates/*", "plugins/*"]
exclude = ["plugins/README.md"]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.91"
repository = "https://github.com/jyliuu/rinky"
publish = false

# Every third-party crate a later phase needs, pinned once. Members inherit with
# `foo = { workspace = true, features = [...] }`. Crates whose default features pull in a lot
# are listed with `default-features = false`; a member can add features but cannot remove
# defaults, so each member opts into exactly what it needs.
# All of these were built for armv7-unknown-linux-musleabihf with cargo zigbuild on 2026-10-24
# (see docs/ARCHITECTURE.md "Toolchain").
[workspace.dependencies]
# Internal crates.
ink-device = { path = "crates/ink-device" }
ink-platform = { path = "crates/ink-platform" }
ink-text = { path = "crates/ink-text" }
ink-ui = { path = "crates/ink-ui" }
ink-doc = { path = "crates/ink-doc" }
ink-html = { path = "crates/ink-html" }
ink-formats = { path = "crates/ink-formats" }
ink-mupdf = { path = "crates/ink-mupdf" }
ink-store = { path = "crates/ink-store" }
ink-net = { path = "crates/ink-net" }
ink-plugin = { path = "crates/ink-plugin" }
ink-plugin-abi = { path = "crates/ink-plugin-abi" }
ink-plugin-native = { path = "crates/ink-plugin-native" }
ink-stats = { path = "plugins/stats" }
kosync = { path = "plugins/kosync" }
opds = { path = "plugins/opds" }
calibre = { path = "plugins/calibre" }
insightful = { path = "plugins/insightful" }
usbnet = { path = "plugins/usbnet" }
ssh = { path = "plugins/ssh" }

# Errors, logging, plumbing.
anyhow = "1.0.104"
thiserror = "2.0.21"
log = "0.4.34"
env_logger = { version = "0.11.11", default-features = false }
crossbeam-channel = "0.5.17"
libc = "0.2.191"
# Native plugins: dlopen of plugin libraries (ink-plugin).
libloading = "0.8.9"

# Data formats.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
quick-xml = "0.37.5"
zip = { version = "9.1.0", default-features = false }
# zlib streams (ink-formats: MOBI FONT records, features = ["zlib-rs"]); also in the tree
# through zip and ureq.
flate2 = { version = "1.1.10", default-features = false }
md-5 = "0.10.6"
encoding_rs = "0.8.42"
chardetng = "0.1.17"
rusqlite = { version = "0.37.0", features = ["bundled"] }
# CommonMark with GitHub tables (ink-plugin: the viewer's Markdown).
pulldown-cmark = { version = "0.13.6", default-features = false }

# Text.
fontdue = "0.9.5"
ttf-parser = "0.25.1"
rustybuzz = "0.20.1"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
# The member adds `embed_all` (+3.0 MB in the ARM binary, 82 dictionaries; en-us alone is
# 92 KB) or loads dictionaries from files at run time.
hyphenation = { version = "0.8.4", default-features = false }

# HTML/CSS.
html5ever = "0.39.0"
markup5ever_rcdom = "=0.39.0"
cssparser = "0.35.0"
selectors = "0.31.0"

# Images.
png = "0.18.1"
image = { version = "0.25.10", default-features = false }
resvg = { version = "0.49.0", default-features = false }
usvg = { version = "0.49.0", default-features = false }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
# Bounded decoders for big JPEGs in ink-html (same versions as image's own).
zune-jpeg = "0.5.15"
zune-core = { version = "0.5.3", default-features = false }

# Network: ureq 3 with rustls (ring) and the webpki-roots CA bundle; no OpenSSL.
ureq = { version = "3.5.0", default-features = false }
webpki-roots = "1.0.11"
# Server side of ink-net's test server (same version as ureq's), SHA-256 and random ids.
# Members add features (ink-net: logging, std, tls12, ring).
rustls = { version = "0.23.46", default-features = false }
ring = { version = "0.17.14", default-features = false }

# Plugins: Lua 5.4 built from source by mlua.
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send"] }

# Host simulator window. Not usable on the Kindle target; members gate it with a target cfg.
minifb = "0.28.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Hot dependencies optimised in debug builds: font parsing, rasterising and shaping,
# PNG/JPEG decoding and inflate run on every rendered page and dominated the
# debug-mode test time. Built once; our own crates stay at opt-level 0 for fast
# rebuilds and full debugging.
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.rustybuzz]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3

# Release: fat LTO and one codegen unit (whole-program
# inlining across crates); panic = "unwind" so the panic hook and backtraces work and a
# panicking background thread (pagination) does not take the reader down with it.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo" # keep symbols: function names in crash backtraces (+4.3 MB)

# Emulator measurement builds (`cargo zigbuild --profile emu`, then
# `EMU_DEPLOY_BIN=target/armv7-unknown-linux-musleabihf/emu/rinky scripts/emu-slot.sh
# deploy NAME --no-build`): thin LTO, parallel codegen and incremental, so a round is
# minutes faster than the fat-LTO release used for packages.
[profile.emu]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

# Day-to-day device installs (`scripts/deploy.sh`): optimized like release but without
# LTO, 16 codegen units and incremental, so a change in one crate rebuilds that crate
# and relinks (seconds), instead of re-optimizing the whole program (fat LTO, ~1.5 min).
# Packages for others still use `release`.
[profile.deploy]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
